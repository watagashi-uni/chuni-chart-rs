<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chuni Chart</title><style>body{font:16px system-ui;background:#121722;color:#e5edf8;margin:24px}input,button,select{font:inherit;padding:8px;margin:6px}a{color:#9dc8ff}img{display:block;max-width:100%;margin-top:20px}code{color:#efcf72}</style><h1>Chuni Chart</h1><p>输入部署者提供的谱面文件名，例如 <code>1086_03</code>。</p><form id="form"><input name="name" required placeholder="1086_03" pattern="[A-Za-z0-9_-]{1,80}(\.c2s)?"><label>显示模式<select name="mode"><option value="preview">普通谱面</option><option value="judge">全部判定</option><option value="early_attack_only">提前判定（仅有 Early ATTACK 的音符）</option></select></label><select name="format"><option>png</option><option>jpg</option></select><button>生成预览</button></form><p id="status" role="status"></p><a id="download" hidden>下载图片</a><img id="preview" alt="谱面预览" hidden><p>Bot 可直接获取图片：<code>/api/render?name=1086_03&amp;judge=1&amp;format=png</code></p><p><a href="https://github.com/watagashi-uni/chuni-chart-rs">chuni-chart-rs (AGPL-3.0)</a></p><script src="/app.js"></script></html>
