<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chuni Chart</title><style>body{font:16px system-ui;background:#121722;color:#e5edf8;margin:24px}input,button,select{font:inherit;padding:8px;margin:6px}a{color:#9dc8ff}img{display:block;max-width:100%;margin-top:20px}code{color:#efcf72}</style><h1>Chuni Chart</h1><p>输入部署者提供的谱面文件名，例如 <code>1086_03</code>。</p><form id="form"><input name="name" required placeholder="1086_03" pattern="[A-Za-z0-9_-]{1,80}(\.c2s)?"><label><input type="checkbox" name="judge">判定范围</label><select name="format"><option>png</option><option>jpg</option></select><button>生成预览</button></form><p id="status" role="status"></p><a id="download" hidden>下载图片</a><img id="preview" alt="谱面预览" hidden><p>Bot 可直接获取图片：<code>/api/render?name=1086_03&amp;judge=1&amp;format=png</code></p><p><a href="https://github.com/watagashi-uni/chuni-chart-rs">chuni-chart-rs (AGPL-3.0)</a></p><script>let previous;document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const form=e.target,button=form.querySelector('button'),status=document.querySelector('#status');button.disabled=true;status.textContent='正在生成…';try{const p=new URLSearchParams(new FormData(form));p.set('judge',form.judge.checked?'1':'0');const r=await fetch('/api/render?'+p);if(!r.ok)throw Error(r.status===429?'渲染忙，请稍后重试':'生成失败，请检查文件名或联系部署者');const blob=await r.blob();if(previous)URL.revokeObjectURL(previous);previous=URL.createObjectURL(blob);const img=document.querySelector('#preview');img.src=previous;img.hidden=false;const a=document.querySelector('#download');a.href=previous;a.download='chart.'+form.format.value;a.hidden=false;status.textContent='';}catch(err){status.textContent=err.message;}finally{button.disabled=false;}};</script></html>
