[package]
name = "chuni-chart-rs"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Direct C2S chart image renderer and bounded HTTP service"
repository = "https://github.com/watagashi-uni/chuni-chart-rs"

[dependencies]
axum = "0.8"
http-body = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny-skia = "0.11"
fontdue = "0.9"
png = "0.18"
jpeg-encoder = "0.7"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
